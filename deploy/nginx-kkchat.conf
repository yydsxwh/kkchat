# KKChat 独立站点。不由主站 Node 反代。
# 已占用端口：3000 主站、3001 xiaowenhua、3002 zhouyuding、3003 账号中心、
# 3120 日事、4010 Platform、4100 Academic。KKChat 使用 3210。
# 上线前备份 /etc/nginx，nginx -t 后再 reload，不要 restart。
# 证书由现有 Certbot 管理（listen 443 段由 certbot 维护），这里只描述 location。

server {
    server_name kkchat.yydsxwh.com;
    # 聊天附件最大 20MB，请求体留一点余量。其余接口在应用里各自限制大小。
    client_max_body_size 21m;

    # Android 安装包：静态文件，按版本号命名，旧版本保留。只读目录，不经过 Node。
    location ^~ /downloads/ {
        alias /var/www/kkchat-downloads/;
        default_type application/octet-stream;
        types { application/vnd.android.package-archive apk; application/json json; }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
        autoindex off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 需要关闭缓冲并允许长连接。
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
