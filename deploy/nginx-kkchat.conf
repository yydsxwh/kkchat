# KKChat 独立站点。不由主站 Node 反代。
# 已占用端口：3000 主站、3001 xiaowenhua、3002 zhouyuding、3003 账号中心、
# 3120 日事、4000 Platform、4100 Academic、4200 Knowledge。KKChat 使用 3210。
# 上线前在服务器执行 ss -lntp，确认 3210 空闲；备份 /etc/nginx，nginx -t 后再 reload。
# DNS：kkchat.yydsxwh.com → 这台机器。证书用现有签发方式补这个主机名。

server {
    listen 80;
    listen [::]:80;
    server_name kkchat.yydsxwh.com;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
