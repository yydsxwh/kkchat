name: CI
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kkchat
          POSTGRES_PASSWORD: kkchat
          POSTGRES_DB: kkchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kkchat -d kkchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kkchat:kkchat@127.0.0.1:5432/kkchat_test
      KKCHAT_TEST_DATABASE_URL: postgresql://kkchat:kkchat@127.0.0.1:5432/kkchat_test
      KKCHAT_ORIGIN: http://127.0.0.1:3210
      KKCHAT_SESSION_SECRET: ci-only-kkchat-session-secret-32-characters
      KKCHAT_ATTACHMENT_DIR: /tmp/kkchat-ci-attachments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
